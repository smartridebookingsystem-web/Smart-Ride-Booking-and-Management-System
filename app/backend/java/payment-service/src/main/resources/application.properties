server.port=8083
spring.application.name=payment-service

# Database Configuration (Using existing p03_srbms MySQL database)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/p03_srbms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:system}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Actuator & Management
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# JWT Security Secret
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Default Fare Engine Constants
fare.default.base=50.00
fare.default.per-km=15.00
