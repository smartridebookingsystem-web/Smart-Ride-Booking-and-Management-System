server.port=8080
spring.application.name=api-gateway

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Deduplicate CORS headers if downstream microservices send any
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# Routes Configuration
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/drivers/**,/api/complaints/**

spring.cloud.gateway.routes[1].id=payment-service
spring.cloud.gateway.routes[1].uri=http://payment-service:8083
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/payments/**,/api/wallet/**

spring.cloud.gateway.routes[2].id=ride-service
spring.cloud.gateway.routes[2].uri=http://ride-service:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/rides/**,/api/reviews/**

# AI Service Route - publicly accessible (JWT is optional, handled by AI service itself)
spring.cloud.gateway.routes[3].id=smartride-ai-service
spring.cloud.gateway.routes[3].uri=http://smartride-ai-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/ai/**

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=true

