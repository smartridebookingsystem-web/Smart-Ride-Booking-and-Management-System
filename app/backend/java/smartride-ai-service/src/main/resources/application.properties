# ==========================================
# SMARTRIDE AI SERVICE CONFIGURATION
# ==========================================

spring.application.name=smartride-ai-service
server.port=8084

# ==========================================
# GOOGLE GEMINI / SPRING AI CONFIGURATION
# ==========================================
# API key is read from environment variable - NEVER hardcode here
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash

# ==========================================
# JWT CONFIGURATION
# Uses the same shared secret as auth-service and api-gateway
# ==========================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# ==========================================
# NOTE: CORS is handled by the API Gateway (CorsConfig.java)
# Do NOT configure CORS here — duplicate headers will break requests
# ==========================================

# ==========================================
# VALIDATION
# ==========================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ==========================================
# LOGGING
# ==========================================
logging.level.com.smartride=INFO
logging.level.org.springframework.ai=WARN
# Never log HTTP headers at DEBUG to avoid leaking JWT
logging.level.org.springframework.web=WARN
